name: Arrow Escape

on:
  push:
    paths:
      - "arrow_escape/**"
      - ".github/workflows/arrow_escape.yml"
  pull_request:
    paths:
      - "arrow_escape/**"
  workflow_dispatch:

concurrency:
  group: arrow-escape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: arrow_escape
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: App tests
        run: flutter test

      - name: Engine tests
        working-directory: arrow_escape/packages/arrow_engine
        run: dart pub get && dart analyze && dart test

      - name: Level tool tests + verify shipped levels
        working-directory: arrow_escape/tool
        run: dart pub get && dart analyze && dart test && dart run bin/verify_levels.dart

      # Without a release keystore, builds are signed with the debug key.
      # Keep that key the same across runs so a new build installs over the
      # previous one (a different key makes Android refuse the update).
      - name: Reuse the CI debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 64-bit only: current phones refuse 32-bit apps, and Play serves
      # 32-bit devices from the app bundle anyway.
      - name: Build release APKs (dev flavor, Google test ads)
        run: >
          flutter build apk --release --flavor dev -t lib/main_dev.dart
          --target-platform android-arm64,android-x64
          --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Size budget (< 40 MB per APK)
        run: |
          ls -la build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do
            size=$(stat -c%s "$f")
            echo "$f: $((size / 1024 / 1024)) MB"
            if [ "$size" -gt $((40 * 1024 * 1024)) ]; then
              echo "::error file=$f::APK exceeds the 40 MB budget"; exit 1
            fi
          done

      # Proves each APK parses and is signed, and records its checksum.
      - name: Check the APKs are install-ready
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*.apk; do
            echo "== $f"
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|^sdkVersion|^native-code"
            "$BT/apksigner" verify --verbose --print-certs "$f" 2>&1 | head -20
            "$BT/apksigner" verify "$f"
            sha256sum "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-dev-apks
          path: |
            arrow_escape/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: x64-apk-for-smoke-test
          path: arrow_escape/build/app/outputs/flutter-apk/app-x86_64-dev-release.apk
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: arrow-escape-debug-symbols
          path: arrow_escape/build/symbols
          retention-days: 30

  # Launches the release APK on an emulator and fails if it crashes.
  smoke-test:
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: x64-apk-for-smoke-test
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator (API 34, google_apis)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash arrow_escape/scripts/smoke_test_android.sh apk/app-x86_64-dev-release.apk com.arrowescape.arrow_escape.dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logcat
          path: |
            logcat.txt
            screenshot.png
            ui.xml
          retention-days: 14
