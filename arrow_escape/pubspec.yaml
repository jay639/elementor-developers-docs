name: arrow_escape
description: "Arrow Escape: Traffic Puzzle — tap the cars out of the jam."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  app_tracking_transparency: ^2.0.7
  cloud_firestore: ^7.1.0
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  gma_mediation_applovin: ^2.6.5
  gma_mediation_ironsource: ^2.7.1
  gma_mediation_meta: ^1.7.1
  gma_mediation_unity: ^1.11.1
  google_mobile_ads: ^9.2.0
  purchases_flutter: ^11.0.0
  arrow_engine:
    path: packages/arrow_engine
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  json_annotation: ^4.12.0
  in_app_review: ^2.0.12
  webview_flutter: ^4.14.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/sounds/
    - assets/branding/logo.png
    - assets/legal/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
